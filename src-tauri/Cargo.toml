[package]
name = "wishtory"
version = "0.1.0"
description = "Local Hoyoverse wish history manager (read-only, UIGF compatible)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
url = "2"
regex = "1"
thiserror = "2"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
