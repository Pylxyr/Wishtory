[package]
name = "wishtory-core"
version.workspace = true
description = "Wishtory core: read-only game-cache discovery, history fetching, storage, pity maths, UIGF import/export"
edition = "2021"
rust-version = "1.91"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "sync"] }
dirs = "6"
url = "2"
regex = "1"
thiserror = "2"
chrono = "0.4"
ring = "0.17.14"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

