[package]
name = "wishtory-core"
version.workspace = true
description = "Wishtory core: read-only game-cache discovery, history fetching, storage, pity maths, UIGF import/export"
edition = "2021"
rust-version = "1.91"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
# rustls with the `ring` provider (installed once by `net::install_tls`), so the whole app uses one
# crypto library and no C build of aws-lc is needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "sync", "net", "io-util", "macros"] }
dirs = "7"
url = "2"
regex = "1"
thiserror = "2"
chrono = "0.4"
ring = "0.17"
base64 = "0.23"
# Cloud backup: passphrase hashing, secret wiping, and the OS credential store (Windows Credential
# Manager, Secret Service on Linux) that holds the Google refresh token and the backup passphrase.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
zeroize = "1"
keyring = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "time", "rt", "rt-multi-thread", "sync", "net", "io-util"] }
