[package]
name = "wishtory-bridge"
version = "0.2.1"
description = "flutter_rust_bridge API over wishtory-core: plain data types and one Core handle for the Flutter app"
edition = "2021"
rust-version = "1.91"

[lib]
name = "wishtory_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
wishtory-core = { path = "../wishtory-core" }
