name: Merge safe game catalog updates

# Merges the weekly review PR (catalog-proposal.yml) by itself, but only when it is safe to:
#   - CI passed on exactly the commit that gets merged, and the branch is up to date with main
#     (so the merged tree is the tree CI tested);
#   - every commit is the bot's own (a person's commit means a person wants to review it);
#   - the only file changed is catalog/catalog.json (a banner list change always waits for a person:
#     Paimon.moe drafts can be wrong, and banners decide how saved pulls are read);
#   - the change log this release would publish has entries and every one is "info" (new items).
#     Renames, trait fixes, rarity changes and removals (minor / major) wait for a person.
# Anything else is left open with the reason in this run's summary.
#
# Why this is a separate workflow and not "gh pr merge --auto":
#   - auto-merge only waits for CI when branch protection requires it; without that it would merge
#     at once, before CI has run;
#   - a merge made with the workflow token does not start the push-triggered catalog-release.yml,
#     so the release is started explicitly below.
#
# Switch it off without editing anything: set the repository variable CATALOG_AUTOMERGE to false.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: catalog-automerge
  cancel-in-progress: false

jobs:
  merge:
    # CI is started on the review branch by catalog-proposal.yml with workflow_dispatch.
    if: >-
      vars.CATALOG_AUTOMERGE != 'false'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'catalog-refresh'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # merge the PR and delete the branch
      pull-requests: write
      issues: write # the reminder for new 5-star characters
      actions: write # start catalog-release.yml
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # A workflow_run job has the write token and runs from the default branch. It checks out main
      # (never the review branch) and reads the branch only as data, so nothing from the branch is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check that the candidate is safe to merge
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"

          # Leave the PR for a person: say why in the run summary and stop without failing.
          hold() {
            echo "Not merging automatically: $1"
            printf '### Left for a person\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          pr="$(gh pr list --head catalog-refresh --state open --json number,headRefOid \
            --jq '.[0] | select(.) | "\(.number) \(.headRefOid)"')"
          if [ -z "$pr" ]; then
            echo "No open pull request for catalog-refresh."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r number head <<<"$pr"
          if [ "$head" != "$HEAD_SHA" ]; then
            # The branch moved after this CI run started; the run for the new commit decides.
            echo "CI passed for $HEAD_SHA but the pull request is at $head now."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main catalog-refresh
          [ "$(git rev-parse origin/catalog-refresh)" = "$HEAD_SHA" ] \
            || hold "The review branch moved while this run started."

          git merge-base --is-ancestor origin/main origin/catalog-refresh \
            || hold "main has moved on since CI ran on the review branch. The next weekly run rebuilds the branch from main."

          if git log origin/main..origin/catalog-refresh --no-merges --format=%ae | grep -vxF "$bot_email" >/dev/null; then
            hold "The branch has a commit by a person, so a person reviews it."
          fi

          files="$(git diff --name-only origin/main...origin/catalog-refresh)"
          [ "$files" = "catalog/catalog.json" ] \
            || hold "The pull request changes more than the item catalog (banner list drafts are checked by hand): $(echo "$files" | paste -sd' ' -)"

          # The change log this candidate would publish, the same way catalog-proposal.yml builds it.
          mkdir -p "$RUNNER_TEMP/new"
          for name in catalog banners rules manifest; do
            git show "origin/catalog-refresh:catalog/$name.json" > "$RUNNER_TEMP/new/$name.json"
          done
          bash scripts/fetch-published.sh "$RUNNER_TEMP/published"
          status="$(node scripts/changelog.mjs --new "$RUNNER_TEMP/new" --published "$RUNNER_TEMP/published" \
            --out "$RUNNER_TEMP/manifest.json" --notes catalog/changes.json --summary "$RUNNER_TEMP/changes.md")"
          [ "$status" = "publish" ] || hold "The change log says there is nothing new to publish."
          total="$(jq '.changes | length' "$RUNNER_TEMP/manifest.json")"
          others="$(jq '[.changes[] | select(.severity != "info")] | length' "$RUNNER_TEMP/manifest.json")"
          [ "$total" -gt 0 ] || hold "The change log has no entries."
          [ "$others" -eq 0 ] || hold "$others of $total change log entries are minor or major (not just new items), so a person reviews them.$(printf '\n\n'; cat "$RUNNER_TEMP/changes.md")"

          echo "Safe to merge: $total change log entries, all info."
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
          echo "merge=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Merge
        if: steps.gate.outputs.merge == 'true'
        env:
          PR: ${{ steps.gate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Kept for the reminder step: the PR description carries the list of new 5-star characters.
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          # --match-head-commit refuses the merge if anyone pushed after CI ran.
          if ! out="$(gh pr merge "$PR" --rebase --delete-branch --match-head-commit "$HEAD_SHA" 2>&1)"; then
            echo "$out" >&2
            echo "::error::The merge was refused. A branch rule probably needs a review or another check; merge it by hand."
            exit 1
          fi
          echo "$out"
          # A merge made with the workflow token starts no push-triggered workflow, so the signed
          # release is started here. It publishes only what changed.
          gh workflow run catalog-release.yml --ref main
      - name: Remind about new 5-star characters
        if: steps.gate.outputs.merge == 'true'
        env:
          PR: ${{ steps.gate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Merging by hand, a person reads this list in the PR description. Merged by itself, the list
          # would be lost, and the next weekly run no longer reports the character (it is in the
          # catalog by then), so it goes into an issue. The weekly workflow never touches this title.
          section="$(awk '/^### New 5-star characters/{f=1; print; next} /^### /{f=0} f' "$RUNNER_TEMP/pr-body.md")"
          if [ -z "$section" ]; then
            echo "No new 5-star characters."
            exit 0
          fi
          title="New 5-star character needs a banner entry"
          {
            echo "Merged automatically in #$PR. Add a banner entry for each when its schedule is announced (docs/game-catalog-updates.md, Banner list)."
            echo
            echo "$section"
          } > "$RUNNER_TEMP/reminder.md"
          issue="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/reminder.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/reminder.md"
          fi
