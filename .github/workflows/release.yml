name: Release

# Builds the Windows installer (Wishtory_<version>_x64-setup.exe) and portable zip and publishes a GitHub release.
# Linux has no download: it is built from source (see the README), and CI still builds and tests it on every
# change. You normally never run this by hand: use "Cut release"
# (cut-release.yml). Other ways in:
#   - push a tag vX.Y.Z whose version matches every version file   -> checks, build, publish
#   - Run workflow here                                            -> dry run: builds and uploads the installer as
#                                                                    artifacts; publishes nothing
#   - called by cut-release.yml with the tag it just pushed        -> build, publish
# A release is the Windows setup .exe and .zip and SHA256SUMS.txt, with build provenance attached when the
# repository allows it.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.2.0"
        required: true
        type: string
      skip_checks:
        description: "The caller already ran CI on this code"
        required: false
        type: boolean
        default: false
    # Only these secrets reach this workflow when cut-release.yml calls it (no `secrets: inherit`). Both optional:
    # an unset one is empty and the release notes are written without AI.
    secrets:
      ANTHROPIC_API_KEY:
        description: "Key for the AI release notes; unset means notes without AI"
        required: false
      AI_API_KEY:
        description: "Key for the AI release notes (other provider); unset means notes without AI"
        required: false
      GOOGLE_CLIENT_ID:
        description: "Google OAuth client ID (type Desktop app) for cloud backup; unset builds without cloud backup"
        required: false
      GOOGLE_CLIENT_SECRET:
        description: "Google OAuth client secret for that client; not confidential for a desktop app, see docs/cloud-backup.md"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    # Compiled into the app (option_env! in crates/wishtory-core/src/cloud/oauth.rs). Unset: the release
    # is built without cloud backup. Job level, so every step that compiles Rust sees the same values.
    env:
      WISHTORY_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      WISHTORY_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      # inputs.tag is empty for a tag push or a manual run, which build the triggering ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: ./.github/actions/toolchains

      # The app bundles catalog/*.json and prefers a cached update whose version is not lower, so the
      # bundled copies must carry the versions CI publishes (a file that kept an old number would lose
      # to older cached content after an upgrade). A repository without a catalog release yet is fine.
      - name: Stamp bundled feed versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-published.sh published
          for name in catalog banners rules; do
            if [ -f "published/$name.envelope.json" ]; then
              node scripts/prepare-catalog.mjs "catalog/$name.json" "catalog/$name.json" "published/$name.envelope.json" --stamp
            fi
          done
          # The bundled manifest names the bundled component versions and carries the version the
          # release workflow publishes (the app starts from it and asks for newer ones).
          node scripts/changelog.mjs --new catalog --published published --out catalog/manifest.json --stamp

      - name: Check versions
        id: ver
        shell: bash
        env:
          CALLED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python scripts/bump_version.py --current)"
          tag="v$version"
          # Fails, and says which file disagrees, unless every version file carries this version.
          python scripts/bump_version.py --check "$tag"
          if [ -n "$CALLED_TAG" ] && [ "$CALLED_TAG" != "$tag" ]; then
            echo "::error::Tag $CALLED_TAG does not match the project version $tag"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match the project version $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rust tests
        if: ${{ !inputs.skip_checks }}
        run: cargo test --locked --workspace

      - name: Build the Rust library
        run: cargo build --locked -p wishtory-bridge --release

      - name: App dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: App checks
        if: ${{ !inputs.skip_checks }}
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build the app
        working-directory: app
        run: flutter build windows --release

      # Inno Setup builds the per-user installer from packaging/windows/wishtory.iss.
      - name: Build the installer and the zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $bundle = (Resolve-Path "app/build/windows/x64/runner/Release").Path
          foreach ($needed in "wishtory.exe", "wishtory_bridge.dll") {
            if (-not (Test-Path (Join-Path $bundle $needed))) { throw "$needed is missing from the Windows bundle" }
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $out = (Resolve-Path release).Path

          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup ($LASTEXITCODE)" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$($env:VERSION)" "/DSourceDir=$bundle" "/DOutputDir=$out" packaging/windows/wishtory.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

          Compress-Archive -Path "$bundle\*" -DestinationPath "$out/Wishtory_$($env:VERSION)_windows_x64.zip"

      - name: Check the release files
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $files = @(Get-ChildItem release)
          if ($files.Count -ne 2) { throw "Expected the setup exe and the zip, found $($files.Count) files" }
          foreach ($file in $files) {
            if ($file.Name -notlike "*$($env:VERSION)*") { throw "$($file.Name) does not carry version $($env:VERSION)" }
            "{0}: {1:N1} MB" -f $file.Name, ($file.Length / 1MB)
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    needs: [build]
    # A tag push, or a call from cut-release.yml. A manual dry run has neither.
    # The explicit status check is required: without one GitHub applies an implicit success() over the whole
    # dependency chain.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      models: read # lets the release-notes step use GitHub Models (free) with the built-in token
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum -- *-setup.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Needs a public repo, or GitHub Enterprise Cloud for a private one. Never blocks the release.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
      - name: Write release notes
        env:
          # AI release notes, tried in this order; with none available the notes come from commit messages and
          # a read of the code (scripts/release_notes.py).
          #  1. ANTHROPIC_API_KEY (optional secret)
          #  2. AI_API_KEY secret + AI_BASE_URL and AI_MODEL variables (any OpenAI-compatible service)
          #  3. GitHub Models, free, using the built-in token (needs `models: read` above)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
        run: |
          {
            cat .github/release-notes-header.md
            echo
            python3 scripts/release_notes.py --ai --tag "$TAG" --repo "$GITHUB_REPOSITORY" || {
              echo "::warning::Could not build the changelog; publishing without it." >&2
              echo "See the commit history for what changed."
            }
            echo
            echo "## About this build"
            echo
            echo "The Windows installer is **not code-signed**, so SmartScreen will warn about it. The \`.zip\` is the same app without an installer."
            echo "There is no Linux download: build it from source with the steps in the README (CachyOS and Arch included)."
            if [ "$ATTEST_OUTCOME" = "success" ]; then
              echo "Build provenance: verify with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            fi
          } > notes.md
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      # The release is created as a draft, filled, and only then made public, so nobody ever sees a half-uploaded
      # release. Safe to re-run: an existing release for the tag is updated instead of failing.
      - name: Create the GitHub release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Wishtory $VERSION" --notes-file notes.md --draft=false "${flags[@]}"
          else
            gh release create "$TAG" release/* \
              --title "Wishtory $VERSION" \
              --notes-file notes.md \
              --verify-tag \
              --draft \
              "${flags[@]}"
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json url --jq .url
