name: Release

# Builds the Windows NSIS installer (Wishtory_<version>_x64-setup.exe) and publishes a GitHub Release.
#   - Actions > Release > Run workflow   -> releases the version in src-tauri/tauri.conf.json as v<version>
#   - push a tag vX.Y.Z                  -> same, for that tag (must match the version files)
# Only the NSIS setup .exe is built. No MSI.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A manual run must be started on the default branch.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Release only runs on $DEFAULT_BRANCH, but it was started on $REF_NAME. Pick '$DEFAULT_BRANCH' in the Branch menu."
            exit 1
          fi
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$EVENT" = "push" ]; then TAG="$REF_NAME"; else TAG="v$TAURI"; fi
          VERSION="${TAG#v}"
          for pair in "tauri.conf.json=$TAURI" "package.json=$PKG" "Cargo.toml=$CARGO"; do
            if [ "${pair#*=}" != "$VERSION" ]; then
              echo "::error::$TAG does not match ${pair%%=*} (${pair#*=}). Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json to the same version."
              exit 1
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build:
    needs: version-guard
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build the NSIS installer
        shell: pwsh
        run: |
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }
      - name: Collect the setup .exe
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS setup .exe, found $($setup.Count)" }
          if ($setup[0].Name -notlike "*$($env:VERSION)*") { throw "$($setup[0].Name) does not carry version $($env:VERSION)" }
          if (Test-Path "src-tauri/target/release/bundle/msi") { throw "An MSI was built, but only the NSIS setup is released" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $setup[0].FullName release/
          Get-ChildItem release | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    needs: [version-guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version-guard.outputs.tag }}
      VERSION: ${{ needs.version-guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: release
      - name: Checksum
        run: |
          cd release
          sha256sum ./*-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Created as a draft, filled, and only then made public, so nobody sees a half-uploaded release.
      # Safe to re-run: an existing release for the tag is updated instead of failing.
      - name: Create the GitHub release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Wishtory ${VERSION}" --draft=false "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Wishtory ${VERSION}" \
              --generate-notes \
              --draft \
              "${flags[@]}"
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
