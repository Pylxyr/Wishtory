name: Release

# Builds the Windows NSIS installer (Wishtory_<version>_x64-setup.exe) and publishes a GitHub release.
#
# One click:  Actions -> Release -> Run workflow
# The version is read from the project files (package.json, src-tauri/tauri.conf.json and
# src-tauri/Cargo.toml must all agree). Bump them first, push, then run this workflow.
# Pushing a tag such as v0.2.0 does the same thing; the tag must match the version.
# Only the NSIS setup .exe is built and uploaded (no MSI), plus a SHA256 checksum file.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Check versions
        id: ver
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($pkg -ne $tauri -or $pkg -ne $cargo) {
            throw "Version mismatch: package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$cargo"
          }
          $tag = "v$pkg"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match the project version $tag"
          }
          "version=$pkg" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - run: npm ci

      - name: Frontend checks
        run: npm run check

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the NSIS installer
        shell: pwsh
        run: |
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }

      - name: Collect release files
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $setup = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS setup exe, found $($setup.Count)" }
          if ($setup[0].Name -notlike "*$($env:VERSION)*") { throw "$($setup[0].Name) does not carry version $($env:VERSION)" }
          Copy-Item $setup[0].FullName release/
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup[0].FullName).Hash.ToLower()
          "$hash *$($setup[0].Name)" | Out-File -Encoding ascii -FilePath "release/$($setup[0].Name).sha256"
          Get-ChildItem release | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-Content "release/$($setup[0].Name).sha256"

      - name: Write release notes
        shell: pwsh
        run: |
          $notes = @(
            "Wishtory ${{ steps.ver.outputs.version }}",
            "",
            "Download the setup file below and run it. The installer is per-user and does not need administrator rights.",
            "Verify the download with the .sha256 file (PowerShell: Get-FileHash -Algorithm SHA256 <file>).",
            "",
            "The installer is not code-signed, so Windows SmartScreen may show a warning.",
            "",
            "Wishtory is an unofficial fan project and is not affiliated with HoYoverse or COGNOSPHERE. It only reads files the game already wrote and uses the official history API. No tool can offer a 100% guarantee against future changes by the game publisher. Use at your own risk."
          )
          $notes -join "`n" | Out-File -Encoding utf8 -FilePath notes.md

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Wishtory $VERSION" --notes-file notes.md --draft=false "${flags[@]}"
          else
            # Drafted first and published last, so nobody sees a half-uploaded release.
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Wishtory $VERSION" --notes-file notes.md --draft "${flags[@]}"
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json url --jq .url
