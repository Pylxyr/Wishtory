name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by catalog-proposal.yml on the review branch: a pull request opened with the workflow
  # token does not trigger the pull_request event above.
  workflow_dispatch:
  # Called by cut-release.yml before it bumps anything.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust core, the API layer and the Tauri shell: format, lints and tests, on both systems the app ships for. Wine/Proton
  # discovery has its own unit tests, which run on both too.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Tauri shell links the system web view and GTK on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev pkg-config
      - uses: ./.github/actions/toolchains
        with:
          flutter: "false"
      - run: cargo fmt --all --check
      # The lint policy (deny correctness, suspicious, complexity, perf, style and pedantic, with a few
      # allows) lives in Cargo.toml's [workspace.lints]; rustc warnings are denied too. Runs on both
      # systems so the Windows-only code paths are checked as well.
      - name: Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace

  # The Svelte interface: type and template checks, and a production build (which is what the Tauri
  # shell packages).
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The release automation is code too: the scripts have unit tests, the catalog tooling has its own, and
  # every workflow is linted (expression typos, undefined outputs, shell mistakes) before it can break a release.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Catalog tooling tests
        run: npm run catalog:test
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Lint the Linux install script
        run: shellcheck packaging/linux/install.sh
      - name: Every version file agrees
        run: python3 scripts/bump_version.py --check "v$(python3 scripts/bump_version.py --current)"
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
