name: Refresh pubspec.lock (one-off)

# Run once from the Actions tab, then delete this file. It resolves the Flutter that
# flutter-toolchain.txt names, pins that exact version, regenerates app/pubspec.lock with it,
# and commits both, so CI's `flutter pub get --enforce-lockfile` has a matching lock.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter version from flutter-toolchain.txt
        id: want
        run: |
          version="$(grep -v '^#' flutter-toolchain.txt | head -n 1 | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.want.outputs.version }}

      - name: Pin the exact Flutter version
        run: |
          exact="$(flutter --version --machine | jq -r .frameworkVersion)"
          echo "Resolved Flutter: $exact"
          sed -i -E "0,/^[0-9]+\.[0-9]+\.[0-9a-z]+\$/s//$exact/" flutter-toolchain.txt
          echo "### Flutter pinned to $exact" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate pubspec.lock
        working-directory: app
        run: flutter pub get

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-toolchain.txt app/pubspec.lock
          git diff --cached --stat
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Pin Flutter and refresh pubspec.lock"
          git push
