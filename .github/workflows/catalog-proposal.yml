name: Review game catalog updates

on:
  schedule:
    - cron: '24 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # to start CI on the review branch (see the last step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Prepare review branch
        shell: bash
        run: |
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          # The identity comes first: a merge below makes a commit, and a fresh runner has no
          # identity of its own ("Committer identity unknown").
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"
          git fetch origin main
          git fetch origin catalog-refresh || true

          # The branch is rebuilt from today's main on every run, so the pull request is always one
          # commit on top of main: up to date, never in conflict, and ready for "Rebase and merge".
          # The one exception is a person's own commit on the branch (a corrected banner title,
          # say): that work must survive, so the branch is kept and main is merged into it.
          keep=false
          if git show-ref --verify --quiet refs/remotes/origin/catalog-refresh \
            && git log origin/main..origin/catalog-refresh --no-merges --format=%ae | grep -qvxF "$bot_email"; then
            keep=true
          fi
          if [ "$keep" = true ]; then
            echo "The review branch has a commit by a person; keeping it and merging main into it."
            git checkout -B catalog-refresh origin/catalog-refresh
            git merge --no-edit origin/main
          else
            git checkout -B catalog-refresh origin/main
          fi
          echo "KEEP_BRANCH=$keep" >> "$GITHUB_ENV"
      - name: Build candidate from upstream metadata
        run: |
          git show origin/main:catalog/catalog.json > "$RUNNER_TEMP/previous-catalog.json"
          npm run catalog:update
          npm run banners:track -- --previous "$RUNNER_TEMP/previous-catalog.json" --report "$RUNNER_TEMP/banners-report.md"
      - name: Open or update the review PR, or the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/banners-report.md"
          issue_title="Banner list needs review"
          ready_title="Catalog update ready for review"

          # Number of the open issue with exactly this title, or nothing.
          find_issue() {
            gh issue list --state open --search "in:title \"$1\"" --json number,title \
              --jq "map(select(.title == \"$1\")) | .[0].number // empty"
          }
          issue="$(find_issue "$issue_title")"
          ready="$(find_issue "$ready_title")"

          # A candidate exists when this run changed the files, or when the review branch already
          # differs from main (an earlier run pushed it but no pull request was opened, for example
          # because Actions was not allowed to create one). Without the second check that commit
          # would sit on the branch with nobody told, because this run finds nothing new to commit.
          if git diff --quiet -- catalog/catalog.json catalog/banners.json \
            && git diff --quiet origin/main HEAD -- catalog/catalog.json catalog/banners.json; then
            echo "No catalog changes found."
            # A pull request left over from an earlier candidate has nothing left to propose once
            # main has it all (a person's own branch is never closed from here).
            if [ "$KEEP_BRANCH" != true ] \
              && [ "$(gh pr view catalog-refresh --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
              gh pr close catalog-refresh --comment "Nothing is left to propose: main already has everything the weekly check found."
            fi
            # Nothing to merge, but there may still be something a person should look at.
            if [ -s "$report" ]; then
              if [ -n "$issue" ]; then
                gh issue edit "$issue" --body-file "$report"
              else
                gh issue create --title "$issue_title" --body-file "$report"
              fi
            elif [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The weekly check found nothing to review."
            fi
            exit 0
          fi

          # What the people who update will be told: the change log this candidate would publish,
          # compared with the feeds published now. A failure here only leaves the list out.
          changes="$RUNNER_TEMP/changes.md"
          if bash scripts/fetch-published.sh "$RUNNER_TEMP/published" \
            && mkdir -p "$RUNNER_TEMP/new" \
            && cp catalog/catalog.json catalog/banners.json catalog/rules.json catalog/manifest.json "$RUNNER_TEMP/new/" \
            && node scripts/changelog.mjs --new "$RUNNER_TEMP/new" --published "$RUNNER_TEMP/published" \
              --out "$RUNNER_TEMP/manifest.json" --notes catalog/changes.json --summary "$changes" > /dev/null; then
            :
          else
            echo "The change list could not be generated for this run." > "$changes"
          fi

          {
            echo "Weekly candidate generated from EnkaNetwork game data and Paimon.moe's published item catalog and banner schedule. Please review names, rarity, traits and Paimon keys, and check any drafted banner events against the official notice, before merging. This PR does not change wish records or game mechanics. Version numbers are set automatically when the catalog is published. CI has been started on this branch; when it is green, use Rebase and merge."
            echo
            echo "## Change log users will see"
            echo
            echo "Each entry is marked major, minor or info by fixed rules (docs/game-catalog-updates.md). Add notes or change a severity in \`catalog/changes.json\` in this PR. People whose saved pulls would be read differently are asked to review before the update is applied."
            echo
            cat "$changes"
            echo
            if [ -s "$report" ]; then cat "$report"; fi
          } > "$RUNNER_TEMP/pr-body.md"

          git add catalog/catalog.json catalog/banners.json
          # Nothing is staged when the branch already holds the candidate from an earlier run.
          if ! git diff --cached --quiet; then
            git commit -m "chore: update game catalog and banner list"
          fi
          # The branch was rebuilt from main (unless a person edited it), so an earlier push of it
          # is replaced. The lease refuses if anyone pushed to it since this run fetched it.
          git push --force-with-lease origin catalog-refresh

          if gh pr view catalog-refresh --json number >/dev/null 2>&1; then
            gh pr edit catalog-refresh --title "Review updated game catalog and banner list" --body-file "$RUNNER_TEMP/pr-body.md"
          elif ! created="$(gh pr create --base main --head catalog-refresh --title "Review updated game catalog and banner list" --body-file "$RUNNER_TEMP/pr-body.md" 2>&1)"; then
            echo "$created" >&2
            if ! grep -q "not permitted to create or approve pull requests" <<<"$created"; then
              exit 1
            fi
            # The repository setting that lets Actions open pull requests is off. The branch is
            # already pushed, so leave one issue with a link that opens the pull request in a click.
            {
              echo "A new catalog / banner candidate is ready on the \`catalog-refresh\` branch, but GitHub Actions is not allowed to open the pull request in this repository."
              echo
              echo "**[Open the pull request](https://github.com/$GITHUB_REPOSITORY/compare/main...catalog-refresh?expand=1)**"
              echo
              echo "To let this workflow open it by itself next time: Settings, Actions, General, Workflow permissions, tick *Allow GitHub Actions to create and approve pull requests*."
              echo
              echo "---"
              echo
              cat "$RUNNER_TEMP/pr-body.md"
            } > "$RUNNER_TEMP/ready-body.md"
            if [ -n "$ready" ]; then
              gh issue edit "$ready" --body-file "$RUNNER_TEMP/ready-body.md"
            else
              gh issue create --title "$ready_title" --body-file "$RUNNER_TEMP/ready-body.md"
            fi
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The catalog-refresh branch covers this: see the \"$ready_title\" issue."
            fi
            exit 0
          else
            echo "$created"
          fi
          # Pull requests opened with the workflow token do not start CI by themselves, so it is
          # started here (workflow_dispatch is allowed for that token); its checks appear on the PR.
          gh workflow run ci.yml --ref catalog-refresh \
            || echo "::warning::Could not start CI on catalog-refresh; run it from the Actions tab before merging."
          # A pull request exists now, so the "ready for review" issue is obsolete.
          if [ -n "$ready" ]; then
            gh issue close "$ready" --comment "The review PR for catalog-refresh now covers this."
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The review PR for catalog-refresh now covers this."
          fi
