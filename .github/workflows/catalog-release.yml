name: Publish signed game catalog

on:
  push:
    branches: [main]
    paths: [catalog/catalog.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Sign catalog envelope
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: node scripts/sign-catalog.mjs catalog/catalog.json catalog/catalog.envelope.json
      - name: Publish rolling catalog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view catalog-v1 >/dev/null 2>&1; then
            gh release upload catalog-v1 catalog/catalog.envelope.json --clobber
          else
            gh release create catalog-v1 catalog/catalog.envelope.json --title "Wishtory game catalog" --notes "Signed metadata catalog for Genshin Impact, Honkai: Star Rail, and Zenless Zone Zero. This release contains data only."
          fi
