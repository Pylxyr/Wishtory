version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the shared toolchain steps they call.
    directories:
      - /
      - /.github/actions/toolchains
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The Rust crates (workspace root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # The Rust crate and the Dart package must stay on exactly the same version as the code
      # generator, so this one is moved by hand (see docs/redesign/BUILDING.md).
      - dependency-name: flutter_rust_bridge
  # The Dart packages of the Flutter app.
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: flutter_rust_bridge
