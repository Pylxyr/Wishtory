version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the shared toolchain steps they call.
    directories:
      - /
      - /.github/actions/toolchains
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The Rust crates (workspace root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  # The interface's npm packages (package.json at the root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
