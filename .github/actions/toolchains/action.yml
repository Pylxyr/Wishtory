name: Toolchains
description: >
  Installs the Rust toolchain chosen in rust-toolchain.toml and sets up the build cache. Run it after
  actions/checkout.

runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      run: |
        # The version is chosen in rust-toolchain.toml, never "whatever stable is today".
        channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
        rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
        rustup default "$channel"
        rustc --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
