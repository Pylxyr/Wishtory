name: wishtory
description: Wishtory - local-first wish history and pity tracker for Genshin Impact, Honkai Star Rail and Zenless Zone Zero.
publish_to: none
version: 0.3.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
# Dependencies are added with `flutter pub add` (see docs/redesign/BUILDING.md) so the latest stable
# versions are resolved on your machine. flutter_rust_bridge must be exactly 2.13.0, the version of
# the Rust crate in crates/wishtory-bridge.
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_rust_bridge: 2.13.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/data/icons.json
    - assets/fonts/GoogleSans-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
