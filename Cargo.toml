[workspace]
resolver = "2"
members = ["crates/wishtory-core", "crates/wishtory-bridge"]

[workspace.package]
# The app version. Both crates inherit it, and scripts/bump_version.py keeps it in step with
# package.json, app/pubspec.yaml and Cargo.lock.
version = "0.4.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Argon2 (cloud backup key derivation) is deliberately heavy; unoptimised it makes `cargo test` crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
