[workspace]
resolver = "2"
members = ["crates/wishtory-core", "crates/wishtory-bridge"]

[workspace.package]
# The app version. Both crates inherit it, and scripts/bump_version.py keeps it in step with
# package.json, app/pubspec.yaml and Cargo.lock.
version = "0.3.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
