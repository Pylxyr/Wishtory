[workspace]
resolver = "3"
members = ["crates/wishtory-core", "crates/wishtory-api", "src-tauri"]

[workspace.package]
# The app version. Every crate inherits it, and scripts/bump_version.py keeps it in step with
# package.json, src-tauri/tauri.conf.json and Cargo.lock.
version = "0.6.0-rc2"
# One edition and one minimum Rust for every crate (rust-toolchain.toml installs exactly this version).
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Pylxyr/Wishtory"
# No crate is published to crates.io: the app is built from this repository.
publish = false

# One lint policy for every crate, run in CI as `cargo clippy --workspace --all-targets --all-features`
# with warnings denied (CARGO_BUILD_WARNINGS=deny). The four allowed lints are noise for an application:
# documentation sections for a public API nobody depends on, and length limits on data tables.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
# `assert!(x.is_empty())` reads better than the `assert_eq!(x, [] as [T; 0])` this lint asks for.
assert_is_empty = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Argon2 (cloud backup key derivation) is deliberately heavy; unoptimised it makes `cargo test` crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
